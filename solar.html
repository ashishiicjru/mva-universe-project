<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MVA Robotics Innovation Org — Brahmand Ganga —  Solar System Explorer</title><link rel="stylesheet" href="bg.css"><link rel="stylesheet" href="shared/mva-shell.css"></head><body><div class="w"><h1>Solar System <span>Explorer</span></h1><p class="sub">Pick the Sun, a planet or the Moon to highlight it in orbit and see real NASA images.</p>
<div class="gx"><div class="gw"><canvas id="gal" width="720" height="720"></canvas></div><canvas class="sol" data-labels="1" data-z="1.6" role="img" aria-label="Solar system with planets revolving around the Sun"></canvas></div>
<div class="bd" id="bd"></div><div class="c" id="inf"></div><div class="fl2" id="im"></div></div>
<script src="bg.js"></script><script>
var F={Sun:['Star','1.39 million km wide, holds 99.8% of the Solar System’s mass, surface about 5,500 °C.','sun'],Mercury:['Planet 1','4,879 km wide, closest to the Sun, one year is 88 Earth days.','mercury planet'],Venus:['Planet 2','12,104 km wide, hottest planet (about 465 °C), spins backward.','venus planet'],Earth:['Planet 3 — Home','12,742 km wide, one Moon, the only known world with life.','earth from space'],Moon:['Earth’s Moon','3,474 km wide, about 384,400 km from Earth.','moon surface'],Mars:['Planet 4','6,779 km wide, two moons, home of Olympus Mons, the tallest volcano known.','mars surface'],Jupiter:['Planet 5','139,820 km wide, the largest planet, Great Red Spot storm, dozens of moons.','jupiter planet'],Saturn:['Planet 6','116,460 km wide, famous for its ring system.','saturn planet'],Uranus:['Planet 7','50,724 km wide, rotates tilted on its side.','uranus planet'],Neptune:['Planet 8','49,244 km wide, windiest planet, one year is about 165 Earth years.','neptune planet']};
function pick(n,b){SEL=n;document.querySelectorAll('#bd .btn').forEach(function(x){x.classList.toggle('on',x==b)});var f=F[n];$('inf').innerHTML='<h3>'+n+' — '+f[0]+'</h3><p>'+f[1]+'</p>';var e=$('im');e.innerHTML='';floats([f[2],f[2]+' nasa',f[2]+' image'],e)}
Object.keys(F).forEach(function(n){var b=document.createElement('button');b.className='btn g2';b.textContent=n;b.onclick=function(){pick(n,b)};$('bd').appendChild(b)});pick('Earth',$('bd').children[3]);
</script><script src="shared/mva-shell.js" defer></script></body></html>
