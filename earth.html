<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MVA Robotics Innovation Org — Brahmand Ganga —  Earth Explorer</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="bg.css"><style>.leaflet-tile{filter:none!important}#map{height:68vh;min-height:380px}</style><link rel="stylesheet" href="shared/mva-shell.css"></head><body><div class="w"><h1>Earth <span>Explorer</span></h1><p class="sub">Browse the Earth from space and zoom down to rooftops. Use the layer button on the map for Satellite, Today from space (NASA), Earth at night (NASA) or Street map.</p>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin:14px 0"><input id="q" placeholder="Search any place or address…" style="flex:1;min-width:220px;margin:0" onkeydown="if(event.key=='Enter')sr(this.value)"><button class="btn" style="margin:0" onclick="sr($('q').value)">Search</button><button class="btn g2" style="margin:0" onclick="home()">🏠 Find my home</button></div>
<div class="bd" id="ch"></div><p id="ms" class="mut" style="margin-bottom:10px"></p><div id="map"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="bg.js"></script><script>
var d=new Date(Date.now()-864e5).toISOString().slice(0,10),G='https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/',
sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Imagery © Esri, Maxar, Earthstar Geographics',maxZoom:19}),
st=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}),
td=L.tileLayer(G+'VIIRS_SNPP_CorrectedReflectance_TrueColor/default/'+d+'/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg',{attribution:'NASA GIBS',maxNativeZoom:9,maxZoom:19}),
nt=L.tileLayer(G+'VIIRS_Black_Marble/default/2016-01-01/GoogleMapsCompatible_Level8/{z}/{y}/{x}.png',{attribution:'NASA GIBS',maxNativeZoom:8,maxZoom:19}),
m=L.map('map',{layers:[sat],worldCopyJump:true}).setView([20,78],3),mk=null;
L.control.layers({'Satellite (homes & streets)':sat,'Today from space (NASA)':td,'Earth at night (NASA)':nt,'Street map':st}).addTo(m);
function at(la,lo,z,t){m.flyTo([la,lo],z,{duration:2.5});if(mk)m.removeLayer(mk);mk=L.marker([la,lo]).addTo(m).bindPopup(t).openPopup()}
function home(){$('ms').textContent='Finding your location…';locate(function(p){at(p.lat,p.lon,p.approx?12:18,'🏠 Your home ('+p.place+')');$('ms').textContent=p.approx?'Exact GPS was blocked, so this is an approximate location. Open the pages over https for exact GPS.':'Zoom in or out to explore around your home.'},function(e){$('ms').textContent=e})}
function sr(q){if(!q)return;$('ms').textContent='Searching…';fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q)).then(function(r){return r.json()}).then(function(r){if(!r.length){$('ms').textContent='Place not found.';return}$('ms').textContent=r[0].display_name;at(+r[0].lat,+r[0].lon,16,r[0].display_name)}).catch(function(){$('ms').textContent='Search needs an internet connection.'})}
['Ranchi','Kennedy Space Center','Sriharikota ISRO','Mount Everest','Tokyo','New York'].forEach(function(n){var b=document.createElement('button');b.className='btn g2';b.textContent=n;b.onclick=function(){$('q').value=n;sr(n)};$('ch').appendChild(b)});
</script><script src="shared/mva-shell.js" defer></script></body></html>
