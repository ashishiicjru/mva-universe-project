<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MVA Robotics Innovation Org — Brahmand Ganga —  ISS Live + GPS</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="bg.css"><link rel="stylesheet" href="shared/mva-shell.css"></head><body><div class="w"><h1>ISS <span>Live Tracking</span></h1><p class="sub">Updates every 5 seconds. Press the GPS button to see how far the ISS is from you.</p>
<div class="st"><div><b id="la">—</b><small>Latitude</small></div><div><b id="lo">—</b><small>Longitude</small></div><div><b id="sp">—</b><small>Speed km/h</small></div><div><b id="al">—</b><small>Altitude km</small></div></div>
<button class="btn" onclick="gps()">📍 Use my GPS location</button><button class="btn g2" onclick="m.setView(mk.getLatLng(),4)">Where is ISS now?</button><p id="di" class="q" style="font-size:16px">Press the GPS button to calculate distance.</p><p id="er" class="mut"></p><div id="map" style="margin-top:14px"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="bg.js"></script><script>
var m=L.map('map',{worldCopyJump:true}).setView([20,78],2),f=1,me=null,ps=null;L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(m);
var mk=L.marker([0,0],{icon:L.divIcon({html:'🛰️',className:'iss',iconSize:[30,30]})}).addTo(m),tr=L.polyline([],{color:'#22D3EE'}).addTo(m);
function dist(){if(me&&ps){var k=hav(me[0],me[1],ps.latitude,ps.longitude);$('di').textContent='ISS is '+k.toLocaleString()+' km from you — '+(k<2300?'it is above your horizon, look up!':'not above your horizon right now.')}}
function up(){fetch('https://api.wheretheiss.at/v1/satellites/25544').then(function(r){return r.json()}).then(function(d){ps=d;$('er').textContent='';var p=[d.latitude,d.longitude];mk.setLatLng(p);var a=tr.getLatLngs();a.push(L.latLng(p));if(a.length>120)a.shift();tr.setLatLngs(a);if(f){m.setView(p,3);f=0}
$('la').textContent=d.latitude.toFixed(2);$('lo').textContent=d.longitude.toFixed(2);$('sp').textContent=Math.round(d.velocity).toLocaleString();$('al').textContent=Math.round(d.altitude);dist()}).catch(function(){$('er').textContent='Could not reach the ISS data service — check your internet connection.'})}
function gps(){if(!navigator.geolocation){$('di').textContent='GPS is not supported in this browser.';return}navigator.geolocation.getCurrentPosition(function(p){me=[p.coords.latitude,p.coords.longitude];L.circleMarker(me,{color:'#F97316',radius:8}).addTo(m).bindPopup('You are here').openPopup();dist()},function(e){$('di').textContent='GPS blocked or unavailable ('+e.message+'). Allow location access; some browsers need the page served over https.'},{enableHighAccuracy:true})}
function gps(){$('di').textContent='Finding your location…';locate(function(p){me=[p.lat,p.lon];L.circleMarker(me,{color:'#F97316',radius:8}).addTo(m).bindPopup('You are here ('+p.place+(p.approx?', approximate':'')+')').openPopup();dist();$('er').textContent=p.approx?'Exact GPS was blocked, so an approximate location is used. Open the pages over https (for example on Vercel) for exact GPS.':''},function(e){$('di').textContent=e})}
up();setInterval(up,5000);</script><script src="shared/mva-shell.js" defer></script></body></html>
