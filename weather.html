<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MVA Robotics Innovation Org — Brahmand Ganga —  Space Weather</title><link rel="stylesheet" href="bg.css"><link rel="stylesheet" href="shared/mva-shell.css"></head><body><div class="w"><h1>Space <span>Weather</span></h1><p class="sub">Live KP index and solar wind from NOAA Space Weather Prediction Center. Green = Safe, Yellow = Caution, Red = Danger.</p>
<div class="g" style="margin-top:20px"><div class="c" id="kc"><h3>KP Index (geomagnetic)</h3><p><span class="big" id="kp">—</span></p><p id="ks">Loading…</p></div><div class="c"><h3>Solar Wind Speed</h3><p><span class="big" id="ws">—</span> km/s</p><p id="wt"></p></div></div><p id="al" class="q" style="font-size:16px">Fetching live data…</p><button class="btn" onclick="ld()">Refresh</button></div><script src="bg.js"></script><script>
function ld(){fetch('https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json').then(function(r){return r.json()}).then(function(d){var k=parseFloat(d[d.length-1][1]),s=k<4?['Safe','ok','Space weather is calm today.']:k<6?['Caution','wa','Today geomagnetic storm possible — GPS may be weak.']:['Danger','dn','Strong geomagnetic storm — satellites, GPS and power grids may be affected.'];$('kp').textContent=k;$('ks').textContent=s[0];$('kc').className='c '+s[1];$('al').className='q '+s[1];$('al').textContent=s[2]}).catch(function(){$('al').textContent='Could not load KP data — check your internet connection.'});
fetch('https://services.swpc.noaa.gov/products/summary/solar-wind-speed.json').then(function(r){return r.json()}).then(function(d){$('ws').textContent=Math.round(d.WindSpeed);$('wt').textContent='Updated '+d.TimeStamp}).catch(function(){})}ld();</script><script src="shared/mva-shell.js" defer></script></body></html>
