/* ---------- procedural noise textures ---------- */
function hs(x,y){let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295}
function vn(x,y,px){const xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi,sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy),w=i=>((i%px)+px)%px;
 const a=hs(w(xi),yi),b=hs(w(xi+1),yi),c=hs(w(xi),yi+1),d=hs(w(xi+1),yi+1);return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy}
function fbm(u,v,f,o){let s=0,a=.5,n=0;for(let i=0;i<o;i++){const q=f<<i;s+=a*vn(u*q,v*q,q);n+=a;a/=2}return s/n}
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];

 for(let j=0;j<H;j++)for(let i=0;i<W;i++){const r=fn(i/W,j/H),k=(j*W+i)*4;im.data[k]=r[0];im.data[k+1]=r[1];im.data[k+2]=r[2];im.data[k+3]=r[3]===undefined?255:r[3]}
 x.putImageData(im,0,0);const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t}

earth:(u,v)=>{const h=fbm(u,v,4,6),lat=Math.abs(v-.5)*2;let c;
 if(h<.5)c=mix([8,30,100],[25,100,175],Math.min(1,(h-.3)/.2));
 else{const t=(h-.5)/.25;c=lat<.55?mix([35,105,45],[130,115,70],Math.min(1,t+fbm(u,v,9,3)*.4)):mix([100,110,70],[150,140,120],t);}
 if(lat>.86+fbm(u,v,12,3)*.1)c=mix(c,[240,246,255],.95);return c},
sun:(u,v)=>{const t=fbm(u,v,6,6),w=fbm(u+t*.3,v+t*.3,10,4);let c=mix([210,60,0],[255,225,110],Math.pow(t,1.3)+w*.3);

jupiter:(u,v)=>{const tb=fbm(u,v*3,5,5),b=Math.sin(v*Math.PI*13+tb*5)*.5+.5;let c=mix([150,95,60],[235,210,175],b);c=mix(c,[250,245,235],Math.pow(fbm(u,v*4,8,3),3)*.6);
