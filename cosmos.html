<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MVA Robotics Innovation Org — Brahmand Ganga —  Cosmos Gallery</title><link rel="stylesheet" href="bg.css"><link rel="stylesheet" href="shared/mva-shell.css"></head><body><div class="w"><h1>Cosmos <span>Gallery</span></h1><p class="sub">If a student from Ranchi can build for NASA, any student in India can. Space to Ganga — astronaut to farmer.</p>
<div class="pr"><figure class="fl"><div class="pl moon"></div><figcaption>Moon</figcaption></figure><figure class="fl" style="animation-delay:-2s"><div class="pl mars"></div><figcaption>Mars</figcaption></figure><figure><div class="pl earth"></div><figcaption>Earth — Ganga Basin</figcaption></figure><figure class="fl" style="animation-delay:-4s"><div class="pl jup"></div><figcaption>Jupiter</figcaption></figure><figure class="fl" style="animation-delay:-1s"><div class="sw"><div class="pl sat"></div></div><figcaption>Saturn</figcaption></figure></div>
<h2>Browse real space images (NASA Image Library)</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="gq" placeholder="Search planets, galaxy, nebula, sun…" style="flex:1;min-width:220px;margin:0" onkeydown="if(event.key=='Enter')go(this.value)"><button class="btn" style="margin:0" onclick="go($('gq').value)">Search</button></div>
<div id="ch" style="margin:10px 0"></div><p id="gs" class="mut"></p><div class="g" id="gr" style="margin-top:12px"></div></div>
<div class="mo" id="mo" onclick="this.style.display='none'"><div class="c"><img id="mi" alt=""><h3 id="mt" style="margin-top:10px"></h3><p id="md"></p></div></div><script src="bg.js"></script><script>
['Mars','Jupiter','Saturn','Galaxy','Nebula','Sun','Earth','ISS','Moon','Solar system'].forEach(function(q){var b=document.createElement('button');b.className='btn g2';b.textContent=q;b.onclick=function(){go(q)};$('ch').appendChild(b)});
function go(q){if(!q)return;$('gq').value=q;$('gs').textContent='Searching NASA Image Library…';nasa(q,function(r){var g=$('gr');g.innerHTML='';$('gs').textContent=r.length?r.length+' images — click one to view':'No images found or no internet connection.';r.slice(0,24).forEach(function(p){var c=document.createElement('div'),m=document.createElement('img'),t=document.createElement('p');c.className='c gi';m.loading='lazy';m.src=p.u;t.textContent=p.t;c.append(m,t);c.onclick=function(){$('mi').src=p.u.replace('~thumb','~medium');$('mt').textContent=p.t;$('md').textContent=p.d.slice(0,400);$('mo').style.display='flex'};g.appendChild(c)})})}
go('galaxy');</script><script src="shared/mva-shell.js" defer></script></body></html>
